[api]
base = "http://127.0.0.1:9000"

[llm]
provider = "openai"          # "anthropic" | "openai" (openai-compatible: DeepSeek, Ollama, OpenRouter…)
#model = "unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q6_K_XL"
model = "gpt-5.4"
api_key_env = "OPENAI_API_KEY"
#base_url = "http://127.0.0.1:8001/v1"   # example for provider = "openai"
max_tokens = 32000
temperature = 0.7

[pacing]
min_wait = 2.0
max_wait = 120.0
default_wait = 20.0
alone_min_wait = 20.0            # wait floor while no one is talking to the agent
company_window = 180.0           # seconds since another's speech = "in conversation"
wake_on_speech = true

[telemetry]
otlp_endpoint = "stdout"          # "stdout" prints spans to stderr, no server needed;
                                   # or a real OTLP/HTTP collector e.g. "http://127.0.0.1:4318";
                                   # "" disables. NOTE: `nc` is NOT a valid collector — it
                                   # doesn't speak HTTP, so exports will always fail against it.
capture_content = true            # include full prompt/completion in spans
# service_name = "uoagent-gemma"  # defaults to uoagent-<profile dir>

[budget]                        # tokens per screen section (chars/4 estimate)
goals = 1024
notes = 2048
todo = 1024
memory_index = 4096
recalled = 2048
history = 4096
now = 8192
chat = 4096
events = 4096
last_turn = 8192
