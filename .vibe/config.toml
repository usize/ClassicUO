# ClassicUO AI Sandbox — vibe project configuration
# https://docs.mistral.ai/mistral-vibe/introduction/configuration
#
# Start vibe from the repo root:
#   vibe
# Then invoke Gemma with:
#   /gemma

# Use Devstral for agentic coding/tool-use tasks.
# Swap for "mistral-large-latest" if you prefer a general-purpose model.
active_model = "devstral-2"

# Auto-approve all tool calls so Gemma can act without permission prompts.
# The gemma skill's safety rules govern behavior — the model won't attack
# players or take destructive actions unless you ask it to.
active_agent = "auto-approve"

# Load the UO skill (discovered from .agents/skills/uo/SKILL.md).
# Invoke in vibe chat with: /uo
enabled_skills = ["uo"]

# Allow bash unconditionally so ./ai/uo calls go through without asking.
[tools.bash]
permission = "always"
